<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B1E21">
<meta name="color-scheme" content="dark">
<title>hub</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/hub.svg" type="image/svg+xml">
<link rel="icon" href="icons/hub-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/hub-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="hub.css">
</head>
<body>
<!-- Brilhos do fundo, nas cores dos apps (só decoração). -->
<div class="brilho" aria-hidden="true"><i></i><i></i></div>

<!-- Login (Supabase Auth), antes de tudo: a sessão fica salva e vale para todos os apps.
     hub.js mostra esta tela ou a dos apps; até decidir, as duas ficam escondidas. -->
<main class="entrar" id="v-login" hidden>
  <form class="cartao-login" id="l-form" novalidate>
    <h1><img class="marca" src="icons/hub.svg" alt="" width="56" height="56"><span>hub</span></h1>
    <fieldset id="l-campos">
      <input id="l-usuario" type="text" placeholder="Usuário" aria-label="Usuário" autocomplete="username" autocapitalize="none" spellcheck="false">
      <input id="l-senha" type="password" placeholder="Senha" aria-label="Senha" autocomplete="current-password">
      <button type="submit" id="l-botao">Entrar</button>
    </fieldset>
    <p class="erro" id="l-erro" role="alert"></p>
  </form>
</main>

<main class="hub" id="v-apps" hidden>
  <header class="topo">
    <h1><img class="marca" src="icons/hub.svg" alt="" width="48" height="48"><span>hub</span></h1>
    <!-- Sair: encerra a sessão neste aparelho (vale para todos os apps); toque duplo. -->
    <button type="button" class="sair" id="sair" title="Sair" aria-label="Sair">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v9"/><path d="M6.4 6.4a8 8 0 1 0 11.2 0"/></svg>
    </button>
  </header>
  <!-- Um card por app, cada um na sua pasta, com a cor dele em --cor. App novo: pasta nova +
       um card aqui (o teste tests/hub.test.mjs confere que a pasta tem index.html). -->
  <nav class="apps" aria-label="Apps">
    <a class="app" href="fin/" style="--cor:#A78BFA">
      <img class="app-icone" src="fin/icons/fin-192.png" alt="" width="64" height="64">
      <span class="app-nome">fin</span>
      <span class="app-tipo">Finanças</span>
      <svg class="app-seta" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg>
    </a>
    <a class="app" href="tr/" style="--cor:#6E9BFF">
      <img class="app-icone" src="tr/icon-192.png" alt="" width="64" height="64">
      <span class="app-nome">Diário de Carga</span>
      <span class="app-tipo">Treino</span>
      <svg class="app-seta" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg>
    </a>
    <!-- Atalho externo (não é pasta do hub): Google Agenda. No Android, hub.js troca o link para abrir o app. -->
    <a class="app externo" id="agenda" href="https://calendar.google.com/calendar/r" target="_blank" rel="noopener" style="--cor:#4C8DF6">
      <img class="app-icone" src="icons/agenda.svg" alt="" width="64" height="64">
      <span class="app-nome">Agenda</span>
      <span class="app-tipo">Google Agenda</span>
      <svg class="app-seta" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg>
    </a>
    <!-- Atalho externo: grupo "Hub" do WhatsApp (link de convite; quem já é membro cai direto no grupo). -->
    <a class="app externo" id="whatsapp" href="https://chat.whatsapp.com/GZoDeut1UttAZOeG0Axah1" target="_blank" rel="noopener" style="--cor:#25D366">
      <img class="app-icone" src="icons/whatsapp.svg" alt="" width="64" height="64">
      <span class="app-nome">Hub</span>
      <span class="app-tipo">Grupo do WhatsApp</span>
      <svg class="app-seta" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg>
    </a>
    <!-- Atalho externo: conversa do WhatsApp comigo mesmo (wa.me com o próprio número). -->
    <a class="app externo" id="eu" href="https://wa.me/5511978058566" target="_blank" rel="noopener" style="--cor:#25D366">
      <img class="app-icone" src="icons/whatsapp.svg" alt="" width="64" height="64">
      <span class="app-nome">Eu</span>
      <span class="app-tipo">Conversa comigo</span>
      <svg class="app-seta" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg>
    </a>
  </nav>
</main>
<script src="supabase.js"></script>
<script src="hub.js"></script>
</body>
</html>
