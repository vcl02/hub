<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B1E21">
<meta name="color-scheme" content="dark">
<title>hub</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/hub.svg" type="image/svg+xml">
<link rel="icon" href="icons/hub-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/hub-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="hub.css">
</head>
<body>
<!-- Brilhos do fundo, nas cores dos apps (só decoração). -->
<div class="brilho" aria-hidden="true"><i></i><i></i></div>

<!-- Login (Supabase Auth), antes de tudo: a sessão fica salva e vale para todos os apps.
     hub.js mostra esta tela ou a dos apps; até decidir, as duas ficam escondidas. -->
<main class="entrar" id="v-login" hidden>
  <form class="cartao-login" id="l-form" novalidate>
    <h1><img class="marca" src="icons/hub.svg" alt="" width="56" height="56"><span>hub</span></h1>
    <fieldset id="l-campos">
      <input id="l-usuario" type="text" placeholder="Usuário" aria-label="Usuário" autocomplete="username" autocapitalize="none" spellcheck="false">
      <input id="l-senha" type="password" placeholder="Senha" aria-label="Senha" autocomplete="current-password">
      <button type="submit" id="l-botao">Entrar</button>
    </fieldset>
    <p class="erro" id="l-erro" role="alert"></p>
  </form>
</main>

<main class="hub" id="v-apps" hidden>
  <header class="topo">
    <div>
      <p class="hoje" id="h-data"></p>
      <h1><span>hub</span></h1>
    </div>
    <!-- Sair: encerra a sessão neste aparelho (vale para todos os apps); toque duplo. -->
    <button type="button" class="sair" id="sair" title="Sair" aria-label="Sair">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v9"/><path d="M6.4 6.4a8 8 0 1 0 11.2 0"/></svg>
    </button>
  </header>

  <!-- Dias perfeitos seguidos (todos os hábitos do dia feitos), os últimos 7 dias e as proteções guardadas.
       hub.js preenche com habitos.js. -->
  <section class="perfeito" aria-label="Dias perfeitos">
    <div class="perfeito-topo">
      <p class="perfeito-num"><svg class="chama" viewBox="0 0 24 24" width="34" height="34" fill="currentColor" aria-hidden="true"><path d="M12 2.5c.6 3.1-1 5-2.6 6.8C7.8 11 6.5 12.6 6.5 15a5.5 5.5 0 0 0 11 0c0-2.2-1-4-2.3-5.4.1 1.6-.4 2.8-1.5 3.4.3-3.8-.6-7.6-1.7-10.5z"/></svg><b id="h-perfeitos">0</b><span>dias perfeitos</span></p>
      <p class="protecoes" id="h-protecoes" title="Proteções: 1 a cada semana de treino perfeita"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6z"/></svg><b>0</b></p>
    </div>
    <ol class="perfeito-semana" id="h-semana"></ol>
  </section>

  <!-- Um hábito por linha, na cor do app; tocar abre o app. Peso e sono (um hábito só) são do Corpo. App novo com hábito: linha aqui,
       hábito em habitos.js (o teste tests/hub.test.mjs confere a lista e que a pasta tem index.html). -->
  <nav class="habitos" aria-label="Hábitos">
    <a class="app habito" href="tr/" data-habito="treino" style="--cor:#6E9BFF">
      <img class="app-icone" src="tr/icon-192.png" alt="" width="44" height="44">
      <span class="hab-texto"><span class="app-nome">Treino</span><span class="hab-valor"></span><span class="hab-barra" hidden><i></i></span></span>
      <span class="hab-ofensiva" title="Ofensiva"><svg class="chama" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M12 2.5c.6 3.1-1 5-2.6 6.8C7.8 11 6.5 12.6 6.5 15a5.5 5.5 0 0 0 11 0c0-2.2-1-4-2.3-5.4.1 1.6-.4 2.8-1.5 3.4.3-3.8-.6-7.6-1.7-10.5z"/></svg><b>0</b></span>
      <span class="hab-dias" aria-hidden="true"></span>
    </a>
    <a class="app habito" href="al/" data-habito="deficit" style="--cor:#FFD43B">
      <img class="app-icone" src="al/icons/al-192.png" alt="" width="44" height="44">
      <span class="hab-texto"><span class="app-nome">Déficit</span><span class="hab-valor"></span><span class="hab-barra" hidden><i></i></span></span>
      <span class="hab-ofensiva" title="Ofensiva"><svg class="chama" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M12 2.5c.6 3.1-1 5-2.6 6.8C7.8 11 6.5 12.6 6.5 15a5.5 5.5 0 0 0 11 0c0-2.2-1-4-2.3-5.4.1 1.6-.4 2.8-1.5 3.4.3-3.8-.6-7.6-1.7-10.5z"/></svg><b>0</b></span>
      <span class="hab-dias" aria-hidden="true"></span>
    </a>
    <a class="app habito" href="corpo/" data-habito="corpo" style="--cor:#3DD6B5">
      <img class="app-icone" src="corpo/icons/corpo-192.png" alt="" width="44" height="44">
      <span class="hab-texto"><span class="app-nome">Peso e sono</span><span class="hab-valor"></span><span class="hab-barra" hidden><i></i></span></span>
      <span class="hab-ofensiva" title="Ofensiva"><svg class="chama" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M12 2.5c.6 3.1-1 5-2.6 6.8C7.8 11 6.5 12.6 6.5 15a5.5 5.5 0 0 0 11 0c0-2.2-1-4-2.3-5.4.1 1.6-.4 2.8-1.5 3.4.3-3.8-.6-7.6-1.7-10.5z"/></svg><b>0</b></span>
      <span class="hab-dias" aria-hidden="true"></span>
    </a>
    <a class="app habito" href="agua/" data-habito="agua" style="--cor:#4CC9F0">
      <img class="app-icone" src="agua/icons/agua-192.png" alt="" width="44" height="44">
      <span class="hab-texto"><span class="app-nome">Água</span><span class="hab-valor"></span><span class="hab-barra" hidden><i></i></span></span>
      <span class="hab-ofensiva" title="Ofensiva"><svg class="chama" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M12 2.5c.6 3.1-1 5-2.6 6.8C7.8 11 6.5 12.6 6.5 15a5.5 5.5 0 0 0 11 0c0-2.2-1-4-2.3-5.4.1 1.6-.4 2.8-1.5 3.4.3-3.8-.6-7.6-1.7-10.5z"/></svg><b>0</b></span>
      <span class="hab-dias" aria-hidden="true"></span>
    </a>
  </nav>

  <!-- Atalhos sem hábito, fixos embaixo: Fin e os externos (Google Agenda e a conversa do WhatsApp comigo mesmo).
       No Android, hub.js troca o link da Agenda para abrir o app. -->
  <nav class="doca" aria-label="Atalhos">
    <a class="app atalho" href="fin/" style="--cor:#A78BFA">
      <img class="app-icone" src="fin/icons/fin-192.png" alt="" width="32" height="32">
      <span class="app-nome">Fin</span>
    </a>
    <a class="app atalho externo" id="agenda" href="https://calendar.google.com/calendar/r" target="_blank" rel="noopener" style="--cor:#4C8DF6">
      <img class="app-icone" src="icons/agenda.svg" alt="" width="32" height="32">
      <span class="app-nome">Agenda</span>
    </a>
    <a class="app atalho externo" id="eu" href="https://wa.me/5511978058566" target="_blank" rel="noopener" style="--cor:#F2B544">
      <img class="app-icone" src="icons/anotacoes.svg" alt="" width="32" height="32">
      <span class="app-nome">Anotações</span>
    </a>
  </nav>
</main>
<script src="supabase.js"></script>
<script src="corpo/perfil.js"></script>
<script src="al/gasto.js"></script>
<script src="habitos.js"></script>
<script src="hub.js"></script>
</body>
</html>
