<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <!-- interactive-widget: o teclado do celular encolhe a página, e o campo da conversa fica acima dele -->
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#1B1E21" />
    <meta name="color-scheme" content="dark" />
    <title>Notas</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/notas-192.png" />
    <link rel="apple-touch-icon" href="icons/notas-192.png" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="../base/tokens.css" />
    <link rel="stylesheet" href="../base/componentes.css" />
    <link rel="stylesheet" href="css/notas.css" />
  </head>
  <body>
    <div class="wrap" id="w-lista">
      <!-- Login próprio: só aparece com o app servido fora do hub (testes). Dentro do hub, sem sessão vai para o login de lá. -->
      <section id="v-login" class="view" hidden>
        <form id="l-form" class="login" novalidate>
          <fieldset id="l-campos">
            <input
              id="l-usuario"
              type="text"
              autocomplete="username"
              autocapitalize="none"
              spellcheck="false"
              placeholder="Usuário"
              aria-label="Usuário"
            />
            <input
              id="l-senha"
              type="password"
              autocomplete="current-password"
              placeholder="Senha"
              aria-label="Senha"
            />
            <button type="submit" class="btn primario">Entrar</button>
          </fieldset>
          <p id="l-erro" class="erro" role="alert"></p>
        </form>
      </section>

      <!-- Lista de notas: a editada mais recentemente em cima; + cria uma nota e abre. Tudo por js/telas.js. -->
      <section id="v-lista" class="view" hidden>
        <header class="topo">
          <!-- Hub: volta à página inicial (../), que abre os outros apps -->
          <a class="bt-ic" href="../" id="i-hub" title="Hub" aria-label="Hub">
            <svg
              viewBox="0 0 24 24"
              width="20"
              height="20"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="3" />
              <path
                d="M9.9 9.9 6.6 6.6M14.1 9.9l3.3-3.3M9.9 14.1l-3.3 3.3M14.1 14.1l3.3 3.3"
              />
              <circle cx="5" cy="5" r="2" />
              <circle cx="19" cy="5" r="2" />
              <circle cx="5" cy="19" r="2" />
              <circle cx="19" cy="19" r="2" />
            </svg>
          </a>
          <h1>Notas</h1>
          <button
            type="button"
            class="mais"
            id="n-nova"
            title="Nova nota"
            aria-label="Nova nota"
          >
            <svg
              viewBox="0 0 24 24"
              width="20"
              height="20"
              fill="none"
              stroke="currentColor"
              stroke-width="2.4"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M12 5v14M5 12h14" />
            </svg>
          </button>
        </header>
        <ul class="lista" id="n-lista" aria-label="Notas"></ul>
        <p class="muted vazio" id="n-vazio" hidden>
          Nenhuma nota ainda. Toque em + para criar.
        </p>
      </section>
    </div>

    <!-- Nota aberta (?nota=<id>): no PC, o editor (CodeMirror) na tela toda; no celular, a conversa (um balão por parágrafo).
         O botão do canto troca entre os dois. -->
    <section id="v-nota" class="nota" hidden>
      <header class="topo nota-topo" id="n-topo">
        <button
          type="button"
          class="bt-ic"
          id="n-voltar"
          title="Voltar para a lista"
          aria-label="Voltar para a lista"
        >
          <svg
            viewBox="0 0 24 24"
            width="18"
            height="18"
            fill="none"
            stroke="currentColor"
            stroke-width="2.6"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M15 5l-7 7 7 7" />
          </svg>
        </button>
        <h1 id="n-titulo">Nota</h1>
        <button
          type="button"
          class="bt-ic"
          id="n-modo"
          title="Conversa"
          aria-label="Conversa"
        ></button>
      </header>

      <!-- Barra de seleção da conversa (segurar um balão): no lugar do cabeçalho enquanto houver algo selecionado -->
      <div class="topo selecao" id="s-barra" hidden>
        <button
          type="button"
          class="bt-ic"
          id="s-fechar"
          title="Desmarcar"
          aria-label="Desmarcar"
        >
          <svg
            viewBox="0 0 24 24"
            width="18"
            height="18"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M6 6l12 12M18 6L6 18" />
          </svg>
        </button>
        <b class="num" id="s-qtd">1</b>
        <button
          type="button"
          class="bt-ic"
          id="s-copiar"
          title="Copiar"
          aria-label="Copiar"
        >
          <svg
            viewBox="0 0 24 24"
            width="18"
            height="18"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect x="9" y="9" width="11" height="11" rx="2" />
            <path d="M5 15V6a2 2 0 0 1 2-2h9" />
          </svg>
        </button>
        <button
          type="button"
          class="bt-ic"
          id="s-editar"
          title="Editar"
          aria-label="Editar"
        >
          <svg
            viewBox="0 0 24 24"
            width="18"
            height="18"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M4 20h4L19 9l-4-4L4 16v4z" />
            <path d="M13.5 6.5l4 4" />
          </svg>
        </button>
        <button
          type="button"
          class="bt-ic perigo"
          id="s-apagar"
          title="Apagar (toque duas vezes)"
          aria-label="Apagar"
        >
          <svg
            viewBox="0 0 24 24"
            width="18"
            height="18"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M4 7h16" />
            <path d="M10 11v6M14 11v6" />
            <path d="M6 7l1 13h10l1-13" />
            <path d="M9 7V4h6v3" />
          </svg>
        </button>
      </div>

      <!-- PC: o texto inteiro no editor (js/editor.js) -->
      <div class="editor" id="editor" hidden></div>

      <!-- Celular: cada parágrafo um balão, o mais novo embaixo; o campo embaixo acrescenta (ou troca, ao editar) um parágrafo -->
      <div class="conversa" id="conversa" hidden>
        <ol class="baloes" id="c-baloes" aria-label="Parágrafos"></ol>
        <p class="muted vazio" id="c-vazio" hidden>Nota vazia. Escreva embaixo.</p>
        <p class="c-editando" id="c-editando" hidden>
          Editando um parágrafo
          <button type="button" class="chip" id="c-cancelar">Cancelar</button>
        </p>
        <form id="c-form" class="linha c-form" autocomplete="off">
          <textarea
            id="c-texto"
            class="campo"
            rows="1"
            placeholder="Novo parágrafo"
            aria-label="Novo parágrafo"
          ></textarea>
          <button
            type="submit"
            class="mais"
            id="c-enviar"
            title="Enviar"
            aria-label="Enviar"
          >
            <svg
              viewBox="0 0 24 24"
              width="20"
              height="20"
              fill="none"
              stroke="currentColor"
              stroke-width="2.4"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M5 12h14M13 6l6 6-6 6" />
            </svg>
          </button>
        </form>
      </div>
    </section>

    <p id="sync" class="sync" role="status" hidden></p>
    <p id="toast" class="toast" role="status" hidden></p>
    <script src="../supabase.js"></script>
    <script src="../base/nucleo.js"></script>
    <script src="vendor/codemirror.js"></script>
    <script src="js/config.js"></script>
    <script src="js/util.js"></script>
    <script src="js/banco.js"></script>
    <script src="js/markdown.js"></script>
    <script src="js/editor.js"></script>
    <script src="js/telas.js"></script>
    <script src="js/bootstrap.js"></script>
  </body>
</html>
