# Executa no GitHub a mesma validação local do hub (raiz, fin e tr). O tr e o teste de navegação
# usam Playwright, instalado em tr/ junto com o Chromium.
name: Validação

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências de teste
        working-directory: tr
        run: npm ci && npx playwright install --with-deps chromium
      - name: Executar validação local
        run: node scripts/check.mjs
