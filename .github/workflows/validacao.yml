# Executa no GitHub o mesmo que roda local: ESLint, Prettier, EditorConfig e a validação do hub (raiz, fin, tr, al,
# corpo e agua). Os testes de navegador usam Playwright, instalado na raiz junto com o Chromium.
name: Validação

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências
        run: npm ci && npx playwright install --with-deps chromium
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check
      - name: EditorConfig
        run: npm run editorconfig
      - name: Executar validação local
        run: node scripts/check.mjs
