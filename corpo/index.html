<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1B1E21">
<meta name="color-scheme" content="dark">
<title>Corpo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/corpo-192.png">
<link rel="apple-touch-icon" href="icons/corpo-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/corpo.css">
</head>
<body>
<div class="wrap">

<!-- Login próprio: só aparece com o app servido fora do hub (testes). Dentro do hub, sem sessão vai para o login de lá. -->
<section id="v-login" class="view" hidden>
  <form id="l-form" class="login" novalidate>
    <fieldset id="l-campos">
      <input id="l-usuario" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Usuário" aria-label="Usuário">
      <input id="l-senha" type="password" autocomplete="current-password" placeholder="Senha" aria-label="Senha">
      <button type="submit" class="btn primario">Entrar</button>
    </fieldset>
    <p id="l-erro" class="erro" role="alert"></p>
  </form>
</section>

<!-- Corpo: peso atual, perfil, medida do dia, evolução e histórico. Tudo preenchido por js/telas.js. -->
<section id="v-corpo" class="view" hidden>
  <header class="topo">
    <h1>Corpo</h1>
    <!-- Hub: volta à página inicial (../), que abre os outros apps -->
    <a class="icon-btn" href="../" id="i-hub" title="Hub" aria-label="Hub">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M9.9 9.9 6.6 6.6M14.1 9.9l3.3-3.3M9.9 14.1l-3.3 3.3M14.1 14.1l3.3 3.3"/><circle cx="5" cy="5" r="2"/><circle cx="19" cy="5" r="2"/><circle cx="5" cy="19" r="2"/><circle cx="19" cy="19" r="2"/></svg>
    </a>
  </header>

  <!-- ‹ › e arrastar de lado trocam o dia mostrado (para trás até o 1º dia com registro, para frente até hoje), como no al -->
  <nav class="dia-nav" aria-label="Dia">
    <button type="button" class="bt-ic" id="d-ant" title="Dia anterior" aria-label="Dia anterior"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <b id="d-nome">Hoje</b>
    <button type="button" class="bt-ic" id="d-prox" title="Próximo dia" aria-label="Próximo dia"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
  </nav>
  <!-- Dia anterior (no formulário ou pelo ?dia=, que acompanha o dia): só leitura; Hoje volta para hoje -->
  <p class="so-leitura" id="dia-visto" hidden><span id="dia-nome"></span> · só leitura <button type="button" class="chip-bt" id="dia-hoje">Hoje</button></p>
  <div class="peso-card" id="c-resumo" hidden></div>
  <p class="perfil" id="c-perfil"></p>

  <!-- Medida do dia (hoje por padrão; outro dia pela data): peso e/ou barriga, 1 por dia -->
  <form id="c-form" class="cartao form" novalidate>
    <div class="quando">
      <input id="c-data" type="date" aria-label="Dia" required>
      <input id="c-hora" type="time" aria-label="Horário da medida">
    </div>
    <p class="aviso" id="c-aviso" hidden></p>
    <div class="campo">
      <label for="c-peso">Peso</label>
      <div class="stepper">
        <button type="button" data-passo="peso" data-dir="-1" aria-label="Diminuir peso">−</button>
        <div class="mid"><input id="c-peso" inputmode="decimal" autocomplete="off" placeholder="—"><span class="unit">kg</span></div>
        <button type="button" data-passo="peso" data-dir="1" aria-label="Aumentar peso">+</button>
      </div>
    </div>
    <div class="campo">
      <label for="c-cintura" title="Na linha do umbigo">Barriga</label>
      <div class="stepper">
        <button type="button" data-passo="cintura" data-dir="-1" aria-label="Diminuir barriga">−</button>
        <div class="mid"><input id="c-cintura" inputmode="decimal" autocomplete="off" placeholder="—"><span class="unit">cm</span></div>
        <button type="button" data-passo="cintura" data-dir="1" aria-label="Aumentar barriga">+</button>
      </div>
    </div>
    <button class="btn primario" type="submit">Salvar</button>
  </form>

  <!-- O dia escolhido acima: sono (a noite que terminou nele: dormi e acordei), evacuações e xixis (+1 com o horário; tocar num
       horário tira) e quando foi a última evacuação -->
  <div class="cartao evac" id="ev-cartao">
    <div class="dia-linha sono-linha"><span>Sono</span>
      <label class="hora-l">Dormi<input type="time" id="d-dormiu" aria-label="Dormi às"></label>
      <label class="hora-l">Acordei<input type="time" id="d-acordou" aria-label="Acordei às"></label>
    </div>
    <p class="sono-res" id="d-sono-res" hidden></p>
    <div class="dia-linha">
      <span>Evacuação <b id="ev-total">0</b></span>
      <button type="button" class="chip-bt mais" id="ev-mais" title="Evacuei agora" aria-label="Evacuei agora">+1</button>
    </div>
    <ul class="ev-horas" id="ev-horas"></ul>
    <p class="evac-ultima" id="ev-ultima" hidden></p>
    <div class="dia-linha">
      <span>Xixi <b id="x-total">0</b></span>
      <button type="button" class="chip-bt mais" id="x-mais" title="Fiz xixi agora" aria-label="Fiz xixi agora">+1</button>
    </div>
    <ul class="ev-horas" id="x-horas"></ul>
  </div>

  <!-- Sono: média e as últimas noites, com BOM (8 h ou mais), OK (7 a 8) e RUIM (menos de 7) -->
  <h3 class="sec" id="sn-titulo">Sono</h3>
  <div class="cartao" id="sono"></div>

  <!-- Bexiga: xixis por dia, intervalo e ml bebidos por xixi (a água vem da Água) -->
  <h3 class="sec" id="bx-titulo">Bexiga</h3>
  <div class="cartao" id="bexiga"></div>

  <h3 class="sec">Evolução do peso</h3>
  <div id="c-grafico" class="cartao chart"></div>
  <h3 class="sec">Evolução da barriga</h3>
  <div id="c-grafico-cint" class="cartao chart"></div>
  <h3 class="sec">Histórico</h3>
  <ul id="c-historico" class="cartao hist"></ul>
</section>

<p id="sync" class="sync" role="status" hidden></p>
<p id="toast" class="toast" role="status" hidden></p>
</div>
<script src="../supabase.js"></script>
<script src="perfil.js"></script>
<script src="js/config.js"></script>
<script src="js/util.js"></script>
<script src="js/banco.js"></script>
<script src="js/telas.js"></script>
<script src="js/bootstrap.js"></script>
</body>
</html>
